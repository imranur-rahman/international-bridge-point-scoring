name: bridge_scorekeeper
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Noto Sans Symbols 2 (SIL Open Font License, see assets/fonts/OFL.txt).
  # It draws the suit symbols as text, so that they take the suit colors.
  fonts:
    - family: SuitSymbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
    # Montserrat (SIL Open Font License, see assets/fonts/OFL-Montserrat.txt)
    # for headings. Static Latin subsets made by tool/subset_font.py.
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
