<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Keep the score of rubber bridge deals by the rules.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="IB Score">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#1E6B45">
  <title>IB Score</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Keep the app available offline (see sw.js). Service workers need HTTPS
    // or localhost.
    if ('serviceWorker' in navigator &&
        (location.protocol === 'https:' ||
         ['localhost', '127.0.0.1'].includes(location.hostname))) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('Service worker not registered:', e);
        });
        // After the app has loaded, send the URLs of the loaded files to the
        // worker, so that it stores the files of a first visit too.
        navigator.serviceWorker.ready.then(function (registration) {
          setTimeout(function () {
            var urls = performance.getEntriesByType('resource')
                .map(function (e) { return e.name; });
            urls.push(document.baseURI);
            registration.active.postMessage({ type: 'cache-urls', urls: urls });
          }, 4000);
        });
      });
    }
  </script>
</body>
</html>
