name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time. A newer push cancels a waiting one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        # GitHub Pages serves the app under /<repository name>/.
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Set the service worker version
        # Each deployment gets its own offline cache (see web/sw.js).
        run: |
          sed -i "s/^const BUILD_ID = 'dev';/const BUILD_ID = '${{ github.sha }}';/" build/web/sw.js
          grep -q "const BUILD_ID = '${{ github.sha }}';" build/web/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
